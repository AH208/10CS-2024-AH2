{% extends "base.html" %}
{% block title %}Index{% endblock %}
{% block head %}
{% endblock %}

{% block content %}

    <h1>Welcome {{ user }} to the AI Application!</h1>

<div class="w3-dropdown-hover w3-display-right">
    <button class="w3-button">Page Selection</button>
    <div class="w3-dropdown-content w3-bar-block w3-border-gray w3-deep-purple">
        <a href="/ai_page" class="w3-bar-item w3-button">AI page</a>
        <a href="/settings" class="w3-bar-item w3-button">Settings</a>
    </div>
</div>

<div class="w3-container w3-round-xxlarge w3-deep-purple w3-display-middle">
    <h2>Gemini Quick Access AI</h2>
    <div class="w3-center w3-padding-16">
        <form method="post">
            <textarea name="output" readonly class="w3-deep-purple w3-block" cols="64">{{output}}</textarea>
            <textarea name="input" class="w3-block" cols="64"></textarea>
            <input class="w3-button w3-white w3-border w3-border-red w3-round-large w3-margin-top" type="submit" value="Submit">
        </form>
    </div>
</div>

{% endblock %}
