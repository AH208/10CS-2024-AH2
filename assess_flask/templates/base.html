<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="/static/style.css">
    <title>{% block title %}{% endblock %} - My Webpage</title>
    {% block head %}
    {% endblock %}
  </head>
  <body>
    <div id="content">{% block content %}{% endblock %}</div>
    <div id="footer" class="w3-center w3-round w3-display-bottommiddle">
      {% block footer %}
      <a href="/logout" class="w3-button w3-deep-purple w3-border w3-border-blue-gray w3-round-large">Logout at any time!</a>
      <a href="/homepage" class="w3-button w3-left w3-deep-purple w3-border w3-border-blue-gray w3-round-large">Back to home</a>
      {% endblock %}
  <meta name="viewport" content="width=device-width, initial-scale=1">

  </div>
  </body>
</html>
